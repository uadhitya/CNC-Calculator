<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CNC Pricing Calculator - Professional Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Kalkulator Jasa CNC Profesional</h1>
        
        <div class="space-y-4">
            <div>
                <label>Durasi Mesin (Jam):</label>
                <input type="number" id="machineTime" class="w-full border p-2" value="1">
            </div>
            <div>
                <label>Biaya Operasional per Jam (Listrik/Depresiasi):</label>
                <input type="number" id="hourlyRate" class="w-full border p-2" value="100000">
            </div>
            <div>
                <label>Biaya Setup & Programming (Keahlian):</label>
                <input type="number" id="setupFee" class="w-full border p-2" value="50000">
            </div>
            <button onclick="calculate()" class="w-full bg-blue-600 text-white p-2 rounded">Hitung Harga Jasa</button>
        </div>

        <div id="result" class="mt-6 p-4 bg-gray-50 border-t">
            <h2 class="font-bold">Total Estimasi Biaya:</h2>
            <p id="totalPrice" class="text-xl font-bold text-blue-700">Rp 0</p>
        </div>
    </div>

    <script>
        function calculate() {
            const time = parseFloat(document.getElementById('machineTime').value);
            const rate = parseFloat(document.getElementById('hourlyRate').value);
            const setup = parseFloat(document.getElementById('setupFee').value);
            
            const total = (time * rate) + setup;
            document.getElementById('totalPrice').innerText = 'Rp ' + total.toLocaleString('id-ID');
        }
    </script>
</body>
</html>
